name: Daily fare capture

on:
  schedule:
    # GitHub's scheduled runs are best-effort — they can be delayed or skipped.
    # So we make several attempts spread through the day. The capture is idempotent
    # (one capture per calendar day; later runs just dedupe and add nothing), so the
    # FIRST attempt GitHub actually runs "wins" and the rest are harmless no-ops.
    # For a whole day to be missed, every one of these would have to be skipped.
    # Times are UTC; IST = UTC + 5:30. Odd minute (:37) avoids the busiest slots.
    - cron: "37 4 * * *"     # 10:07 IST  (primary)
    - cron: "37 6 * * *"     # 12:07 IST  (backup)
    - cron: "37 9 * * *"     # 14:37 IST  (backup)
    - cron: "37 13 * * *"    # 18:37 IST  (backup)
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# Allow the job to commit the updated database + dashboard back to the repo.
permissions:
  contents: write

concurrency:
  group: fare-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture fares and rebuild dashboard
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python capture.py

      - name: Publish dashboard as index.html (for GitHub Pages)
        run: cp dashboard.html index.html

      - name: Commit updated data (only when there is genuinely new data)
        run: |
          git config user.name  "fare-tracker-bot"
          git config user.email "actions@github.com"
          # The databases are the source of truth for "is there new data?".
          # If neither changed, a later same-day run does nothing at all.
          git add prices.db aviation.db
          if git diff --cached --quiet; then
            echo "No new data today — skipping (dashboard already up to date)."
          else
            git add dashboard.html index.html fares.xlsx aviation.xlsx
            git commit -m "Daily capture $(date -u +%Y-%m-%d)"
            git push
          fi
