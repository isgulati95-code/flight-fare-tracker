name: Daily fare capture

on:
  # Manual only. Press "Run workflow" on the Actions tab once a day.
  # No scheduled timer: GitHub's cron proved unreliable, whereas a manual run
  # always executes. This also keeps usage to one run/day, within the free API tier.
  workflow_dispatch: {}

# Allow the job to commit the updated database + dashboard back to the repo.
permissions:
  contents: write

concurrency:
  group: fare-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture fares and rebuild dashboard
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python capture.py

      - name: Publish dashboard as index.html (for GitHub Pages)
        run: cp dashboard.html index.html

      - name: Commit updated data (only when there is genuinely new data)
        run: |
          git config user.name  "fare-tracker-bot"
          git config user.email "actions@github.com"
          git add prices.db aviation.db
          if git diff --cached --quiet; then
            echo "No new data today — skipping (dashboard already up to date)."
          else
            git add dashboard.html index.html fares.xlsx aviation.xlsx
            git commit -m "Daily capture $(date -u +%Y-%m-%d)"
            git push
          fi
